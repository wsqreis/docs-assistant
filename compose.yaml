services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: docs-postgres
    environment:
      POSTGRES_USER: docs
      POSTGRES_PASSWORD: docs
      POSTGRES_DB: docs
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - docs-postgres-data:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs -d docs"]
      interval: 5s
      retries: 20

volumes:
  docs-postgres-data:
